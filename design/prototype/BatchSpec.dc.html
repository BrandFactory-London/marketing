<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New batch</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bfm/tokens.css">
<link rel="stylesheet" href="ds/bfm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:#f7f9fb}
a{color:#0e7c86}a:hover{color:#0b6770}
</style>
</helmet>
<div class="bfm-root" style="display: flex; flex-wrap: wrap; min-height: 1000px; font-family: var(--font-sans); background: var(--surface-50); color: var(--ink);">
  <dc-import name="Nav" current="projects" hint-size="240px,1000px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; padding: 48px 40px; display: flex; flex-direction: column; gap: 24px; max-width: 1200px;">
    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <p class="small" style="margin: 0;"><a href="Projects.dc.html">Projects</a> <span style="color: var(--ink-muted);">/</span> <a href="Project.dc.html">Migss Interiors website</a></p>
        <h1 class="title" style="margin: 4px 0 0;">New batch</h1>
      </div>
      <ol class="bfm-stepper" aria-label="Batch progress">
        <li class="bfm-step bfm-step-current" aria-current="step"><span class="bfm-step-dot">1</span>Spec</li>
        <li class="bfm-step-line" aria-hidden="true"></li>
        <li class="bfm-step"><span class="bfm-step-dot">2</span>Confirm</li>
        <li class="bfm-step-line" aria-hidden="true"></li>
        <li class="bfm-step"><span class="bfm-step-dot">3</span>Generate</li>
        <li class="bfm-step-line" aria-hidden="true"></li>
        <li class="bfm-step"><span class="bfm-step-dot">4</span>Review</li>
        <li class="bfm-step-line" aria-hidden="true"></li>
        <li class="bfm-step"><span class="bfm-step-dot">5</span>Publish</li>
      </ol>
    </div>

    <section class="bfm-card" style="display: flex; flex-direction: column; gap: 16px;">
      <h2 class="heading" style="margin: 0;">Batch settings</h2>
      <p class="small" style="margin: 0; color: var(--ink-muted);">These apply to every post unless a post overrides them below.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px;">
        <label class="bfm-field"><span class="bfm-label">Project</span><select class="bfm-input"><option>Migss Interiors website</option></select></label>
        <label class="bfm-field"><span class="bfm-label">Batch name</span><input class="bfm-input" value="November SEO posts"></label>
        <label class="bfm-field"><span class="bfm-label">Length (words)</span><div style="display: flex; gap: 8px; align-items: center;"><input class="bfm-input" value="1800" aria-label="Minimum words"><span class="small" style="color: var(--ink-muted);">to</span><input class="bfm-input" value="2500" aria-label="Maximum words"></div></label>
        <label class="bfm-field"><span class="bfm-label">Call to action</span><select class="bfm-input"><option>Book a free design consultation</option><option>Request a quote</option><option>Call us</option></select></label>
        <label class="bfm-field"><span class="bfm-label">FAQ block</span><select class="bfm-input"><option>Only where useful</option><option>Always</option><option>Never</option></select></label>
        <label class="bfm-field" style="grid-column: 1 / -1;"><span class="bfm-label">Notes for the writer</span><textarea class="bfm-input" placeholder="Anything this batch should mention or avoid, e.g. a seasonal offer"></textarea></label>
      </div>
    </section>

    <section class="bfm-card" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <h2 class="heading" style="margin: 0;">AI models</h2>
        <a class="small" href="Settings.dc.html">Change defaults</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px 24px;">
        <label class="bfm-field"><span class="bfm-label">Writer model</span><select class="bfm-input"><option>Default: Opus</option><option>Sonnet</option><option>Haiku</option></select><span class="bfm-help">Drafts each post.</span></label>
        <label class="bfm-field"><span class="bfm-label">Critic model</span><select class="bfm-input"><option>Default: Sonnet</option><option>Opus</option><option>Haiku</option></select><span class="bfm-help">Checks each draft against the knowledge pack.</span></label>
      </div>
    </section>

    <section class="bfm-card" style="display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;">
        <h2 class="heading" style="margin: 0;">Posts ({{count}})</h2>
        <button class="bfm-btn bfm-btn-secondary bfm-btn-sm" onClick="{{addPost}}">Add post</button>
      </div>
      <sc-for list="{{posts}}" as="p" hint-placeholder-count="3">
        <div class="bfm-reveal" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px 16px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface-50);">
          <label class="bfm-field"><span class="bfm-label">Topic</span><input class="bfm-input" value="{{p.topic}}" placeholder="Your topic"></label>
          <label class="bfm-field"><span class="bfm-label">Target keyword</span><input class="bfm-input" value="{{p.keyword}}" placeholder="Primary keyword"></label>
          <label class="bfm-field"><span class="bfm-label">Post type</span><select class="bfm-input"><option>{{p.type}}</option><option>Comparison</option><option>Cost guide</option><option>How-to</option><option>Ideas</option><option>Local area page</option></select></label>
          <label class="bfm-field"><span class="bfm-label">Location</span><select class="bfm-input"><option>{{p.location}}</option><option>No location</option><option>Chigwell</option><option>Loughton</option><option>Essex</option></select></label>
        </div>
      </sc-for>
    </section>

    <div style="display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; padding-bottom: 24px;">
      <a class="bfm-btn bfm-btn-ghost" href="Project.dc.html" style="text-decoration: none;">Cancel</a>
      <a class="bfm-btn bfm-btn-primary" href="SpecConfirm.dc.html" style="text-decoration: none;">Draft the spec</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      posts: [
        { topic: 'Wet room vs shower tray', keyword: 'wet room vs shower tray', type: 'Comparison', location: 'No location' },
        { topic: 'Bathroom renovation cost in Essex', keyword: 'bathroom renovation cost essex', type: 'Cost guide', location: 'Essex' },
        { topic: 'Walk-in shower ideas for small bathrooms', keyword: 'walk in shower small bathroom', type: 'Ideas', location: 'No location' },
        { topic: 'Bathroom fitters in Chigwell', keyword: 'bathroom fitters chigwell', type: 'Local area page', location: 'Chigwell' }
      ]
    };
  }
  renderVals() {
    return {
      posts: this.state.posts,
      count: String(this.state.posts.length),
      addPost: () => this.setState({ posts: this.state.posts.concat([{ topic: '', keyword: '', type: 'Comparison', location: 'No location' }]) })
    };
  }
}
</script>
</body>
</html>
