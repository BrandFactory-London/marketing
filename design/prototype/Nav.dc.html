<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/bfm/tokens.css">
<link rel="stylesheet" href="ds/bfm/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav class="bfm-nav" aria-label="Main" style="font-family: var(--font-sans); color: var(--ink); min-height: 1000px; height: 100%;">
  <div class="bfm-nav-brand" style="display: flex; align-items: center; gap: 10px;">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="7" fill="#0e7c86"></rect><circle cx="15" cy="7" r="3" fill="#ffa585"></circle></svg>
    BrandFactory Marketing
  </div>
  <sc-for list="{{items}}" as="item" hint-placeholder-count="4">
    <a class="bfm-nav-item" href="{{item.href}}" aria-current="{{item.ac}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{item.d}}"></path></svg>
      {{item.label}}
      <sc-if value="{{item.hasCount}}" hint-placeholder-val="{{false}}"><span class="bfm-nav-count">{{item.count}}</span></sc-if>
    </a>
  </sc-for>
  <div class="bfm-nav-section">Settings</div>
  <sc-for list="{{settings}}" as="item" hint-placeholder-count="2">
    <a class="bfm-nav-item" href="{{item.href}}" aria-current="{{item.ac}}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="{{item.d}}"></path></svg>
      {{item.label}}
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","calendar","crm","projects","posts","review","rules","models","connections"],"default":"home"},"$preview":{"width":240,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'home';
    const mark = (id) => (id === cur ? 'page' : 'false');
    const icons = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      calendar: 'M4 6.5A1.5 1.5 0 0 1 5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5zM4 10h16M8 3v4M16 3v4M8 14h2M14 14h2',
      crm: 'M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.3a3.5 3.5 0 0 1 0 6.4M18.5 20a6.5 6.5 0 0 0-3-5.5',
      posts: 'M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM14 3v5h5M9 13h7M9 17h5',
      projects: 'M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z',
      knowledge: 'M5 4.5A1.5 1.5 0 0 1 6.5 3H19v14H6.5A1.5 1.5 0 0 0 5 18.5zM5 18.5A1.5 1.5 0 0 0 6.5 20H19v-3M9 7h6M9 10.5h4',
      review: 'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM8.5 12.5l2.5 2.5 4.5-5',
      models: 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z',
      connections: 'M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1'
    };
    return {
      items: [
        { label: 'Home', href: 'Main.dc.html', ac: mark('home'), d: icons.home, hasCount: false },
        { label: 'Calendar', href: 'Calendar.dc.html', ac: mark('calendar'), d: icons.calendar, hasCount: false },
        { label: 'CRM', href: 'CRM.dc.html', ac: mark('crm'), d: icons.crm, hasCount: false },
        { label: 'Projects', href: 'Projects.dc.html', ac: mark('projects'), d: icons.projects, hasCount: false },
        { label: 'Posts', href: 'Posts.dc.html', ac: mark('posts'), d: icons.posts, hasCount: false },
        { label: 'Review queue', href: 'Review.dc.html', ac: mark('review'), d: icons.review, hasCount: true, count: '3' }
      ],
      settings: [
        { label: 'BrandFactory rules', href: 'Settings.dc.html', ac: mark('rules'), d: icons.knowledge },
        { label: 'AI models', href: 'Settings.dc.html', ac: mark('models'), d: icons.models },
        { label: 'Connections', href: 'Settings.dc.html', ac: mark('connections'), d: icons.connections }
      ]
    };
  }
}
</script>
</body>
</html>
