<!-- @dsCard group="Layout" height=200 subtitle="Static and interactive client cards" -->
<div class="bfm-root" style="padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px;">
  <div class="bfm-card bfm-card-interactive">
    <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
      <div>
        <p class="bfm-card-title">Migss Interiors</p>
        <p class="bfm-card-meta">migssinteriors.com · Wix Blog</p>
      </div>
      <span class="bfm-badge bfm-badge-success">Pack approved</span>
    </div>
    <p class="bfm-card-meta" style="margin-top: 16px;">4 posts in review · last published 14 Oct</p>
  </div>
  <div class="bfm-card">
    <div style="display: flex; justify-content: space-between; align-items: start; gap: 12px;">
      <div>
        <p class="bfm-card-title">BrandFactory London</p>
        <p class="bfm-card-meta">brandfactorylondon.com · Posts feed</p>
      </div>
      <span class="bfm-badge bfm-badge-neutral">Draft pack</span>
    </div>
    <p class="bfm-card-meta" style="margin-top: 16px;">Knowledge pack needs approval</p>
  </div>
</div>
