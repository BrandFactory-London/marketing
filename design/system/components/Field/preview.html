<!-- @dsCard group="Forms" height=320 subtitle="Text, select, textarea and error states" -->
<div class="bfm-root" style="padding: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 24px;">
  <label class="bfm-field">
    <span class="bfm-label">Target keyword</span>
    <input class="bfm-input" value="wet room vs shower tray">
    <span class="bfm-help">One primary keyword per post.</span>
  </label>
  <label class="bfm-field">
    <span class="bfm-label">Post type</span>
    <select class="bfm-input"><option>Comparison</option><option>Cost guide</option><option>How-to</option></select>
  </label>
  <label class="bfm-field">
    <span class="bfm-label">Notes for the writer</span>
    <textarea class="bfm-input" placeholder="Anything this batch should mention or avoid"></textarea>
  </label>
  <label class="bfm-field bfm-field-error">
    <span class="bfm-label">Length (words)</span>
    <input class="bfm-input" value="300">
    <span class="bfm-help">SEO posts need at least 1,200 words.</span>
  </label>
</div>
